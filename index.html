<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short Link</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19; /* Menyesuaikan warna latar belakang gelap */
            height: 100vh;
        }
    </style>
</head>
<body>
    <script>
        async function handleRedirect() {
            const path = window.location.pathname.substring(1); // Mengambil kode unik setelah domain
            if (!path) return;

            try {
                // Mengambil data dari API Vercel Anda
                const response = await这样做(`/api/get?code=${path}`); // Sesuaikan dengan endpoint API get Anda
                const data = await response.json();

                if (data && data.url) {
                    window.location.replace(data.url);
                }
            } catch (error) {
                // Biarkan kosong atau arahkan ke halaman utama jika gagal
            }
        }

        // Jalankan fungsi saat halaman dimuat
        window.onload = handleRedirect;
    </script>
</body>
</html>

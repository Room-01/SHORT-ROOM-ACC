<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thegenz | Link Shortener v2</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #10b981;
      --accent-hover: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .wrapper {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Top Bar Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5px;
    }

    .brand {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand span {
      color: var(--accent-color);
    }

    .logout-btn {
      color: #ef4444;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 6px 14px;
      border-radius: 20px;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    /* Main Form Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    textarea, input[type="text"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.9rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus, input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    textarea {
      height: 90px;
      resize: none;
    }

    /* Pill Selector Custom */
    .mode-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #0f172a;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .mode-option {
      text-align: center;
      padding: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .mode-option.active {
      background: var(--accent-color);
      color: #000;
    }

    /* Generate Button */
    .btn-generate {
      width: 100%;
      background: var(--accent-color);
      color: #000000;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-generate:hover {
      background: var(--accent-hover);
    }

    /* Result Box */
    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      display: none;
    }

    .result-card.active {
      display: block;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-header {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .result-box {
      background: #0f172a;
      border: 1px dashed var(--accent-color);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .result-url {
      color: var(--accent-color);
      font-weight: 700;
      font-size: 0.85rem;
      word-break: break-all;
    }

    .btn-copy {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-copy:hover {
      background: #e2e8f0;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    
    <!-- Top Navigation -->
    <div class="top-bar">
      <div class="brand">Thegenz <span>//</span> Link Shortener</div>
      <a href="#" class="logout-btn">LOGOUT</a>
    </div>

    <!-- Form Generator -->
    <div class="card">
      <form id="shortenerForm">
        
        <div class="form-group">
          <label>Destination URLs</label>
          <textarea id="targetUrl" placeholder="Tempel URL di sini (contoh: https://domain-anda.com/promo)..." required></textarea>
        </div>

        <div class="form-group">
          <label>Domain Mode</label>
          <div class="mode-selector">
            <div class="mode-option active">AUTO</div>
            <div class="mode-option">PICK</div>
          </div>
        </div>

        <div class="form-group">
          <label>Meta Details</label>
          <input type="text" id="metaTitle" placeholder="Title (Opsional)" style="margin-bottom: 10px;">
          <input type="text" id="metaImage" placeholder="Image URL (Opsional)">
        </div>

        <button type="submit" class="btn-generate">GENERATE LINK</button>

      </form>
    </div>

    <!-- Result Section -->
    <div class="result-card" id="resultCard">
      <div class="result-header">Hasil Short Link Kamu</div>
      <div class="result-box">
        <span class="result-url" id="outputUrl">https://virginiaroom.biz.id/go...</span>
        <button class="btn-copy" onclick="copyToClipboard()">COPY LINK</button>
      </div>
    </div>

  </div>

  <script>
    document.getElementById('shortenerForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const inputUrl = document.getElementById('targetUrl').value.trim();
      const titleVal = document.getElementById('metaTitle').value.trim();
      const imageVal = document.getElementById('metaImage').value.trim();
      
      const resultCard = document.getElementById('resultCard');
      const outputUrl = document.getElementById('outputUrl');

      if (!inputUrl) return;

      // Menyusun URL generator yang membawa parameter url, title, & image
      let generatedLink = `https://virginiaroom.biz.id/go?url=${encodeURIComponent(inputUrl)}`;

      if (titleVal) {
        generatedLink += `&title=${encodeURIComponent(titleVal)}`;
      }
      if (imageVal) {
        generatedLink += `&image=${encodeURIComponent(imageVal)}`;
      }

      // Update isi URL dan tampilkan kartu hasil
      outputUrl.innerText = generatedLink;
      resultCard.classList.add('active');
    });

    function copyToClipboard() {
      const urlText = document.getElementById('outputUrl').innerText;
      navigator.clipboard.writeText(urlText);
      alert('Link berhasil disalin!');
    }
  </script>

</body>
</html>
